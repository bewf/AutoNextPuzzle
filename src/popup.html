<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoNextPuzzle</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #262421;
      --surface: #302e2b;
      --surface-hover: #383531;
      --input-bg: #201e1c;
      --border: #423f3b;
      --text: #f0efec;
      --muted: #9e9b95;
      --accent: #81b64c;
      --accent-hover: #90c55b;
      --switch-off: #4a4742;
      --danger: #d75a52;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f5f2;
        --surface: #ffffff;
        --surface-hover: #faf9f7;
        --input-bg: #f1efeb;
        --border: #dfdcd6;
        --text: #22201d;
        --muted: #6e6a63;
        --switch-off: #c8c4bc;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 326px;
      margin: 0;
      padding: 18px 18px 14px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: block;
    }

    .brand-text {
      min-width: 0;
    }

    .heading {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .subheading {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .setting-row:hover {
      background: var(--surface-hover);
    }

    .setting-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .setting-name {
      display: block;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
    }

    .setting-sub {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .setting-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .input-wrap {
      display: inline-flex;
      align-items: center;
      width: 82px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      transition: border-color 140ms ease;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
    }

    .input-wrap.invalid {
      border-color: var(--danger);
    }

    .delay-input {
      appearance: textfield;
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0 2px 0 7px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: 600 13px/1 inherit;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .delay-input::-webkit-inner-spin-button,
    .delay-input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .unit {
      flex: 0 0 auto;
      padding: 0 7px 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      user-select: none;
    }

    .switch {
      appearance: none;
      position: relative;
      width: 40px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--switch-off);
      cursor: pointer;
      flex: 0 0 auto;
      transition: background-color 150ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: transform 150ms ease;
    }

    .switch[aria-checked="true"] {
      background: var(--accent);
    }

    .switch[aria-checked="true"]:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .switch[aria-checked="true"]::after {
      transform: translateX(18px);
    }

    .switch:disabled,
    .delay-input:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .switch:focus-visible,
    .report-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .report-link {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition: color 140ms ease;
    }

    .report-link:hover {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <header class="brand">
    <img class="brand-icon" src="../icons/icon.svg" alt="" width="34" height="34">
    <div class="brand-text">
      <h1 class="heading">AutoNextPuzzle</h1>
      <p class="subheading">Choose what happens when a puzzle ends.</p>
    </div>
  </header>

  <main class="settings-list">
    <div class="setting-row">
      <div class="setting-info">
        <label class="setting-name" for="autoNextDelayInput">Auto Next</label>
        <span class="setting-sub">Advance on solve</span>
      </div>
      <div class="setting-controls">
        <span class="input-wrap" id="autoNextDelayWrap">
          <input class="delay-input" id="autoNextDelayInput" type="number" min="0" max="10000" step="1" value="50" inputmode="numeric" aria-label="Auto Next delay in milliseconds" disabled>
          <span class="unit">ms</span>
        </span>
        <button id="autoNextButton" class="switch" type="button" role="switch" aria-checked="false" aria-label="Toggle Auto Next" disabled></button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <label class="setting-name" for="autoRetryDelayInput">Auto Retry</label>
        <span class="setting-sub">Retry on miss</span>
      </div>
      <div class="setting-controls">
        <span class="input-wrap" id="autoRetryDelayWrap">
          <input class="delay-input" id="autoRetryDelayInput" type="number" min="0" max="10000" step="1" value="150" inputmode="numeric" aria-label="Auto Retry delay in milliseconds" disabled>
          <span class="unit">ms</span>
        </span>
        <button id="autoRetryButton" class="switch" type="button" role="switch" aria-checked="false" aria-label="Toggle Auto Retry" disabled></button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <a class="report-link" href="https://github.com/bewf/AutoNextPuzzle/issues" target="_blank" rel="noreferrer">Report an issue</a>
  </footer>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
